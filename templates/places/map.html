{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h1>Interactive Tourist Map</h1>
    <p>Visualise all attractions within 25 km of Thellambura. Click any marker to view highlights.</p>
</div>

<!-- The Map Container -->
<div id="map" class="map-container"></div>

<!-- Safely pass Python data to JavaScript -->
{{ places_data|json_script:"places-data" }}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Initialize map
    var map = L.map('map').setView([6.0328, 80.2170], 11);
    
    // 2. Load OpenStreetMap tiles (with the referrer fix we added earlier)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 3. Get the data
    var places = JSON.parse(document.getElementById('places-data').textContent);
    
    // 4. Custom Green Icon
    var greenIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    // 5. Loop and add pins
    places.forEach(function(place) {
        L.marker([place.lat, place.lng], {icon: greenIcon})
            .addTo(map)
            .bindPopup(`
                <div style="font-family: Arial, sans-serif;">
                    <b style="font-size:14px;">${place.name}</b><br>
                    <span style="font-size:12px; color:#666;">${place.category} | 📍 ${place.distance} km</span><br>
                    <a href="/place/${place.id}/" style="color:#1565c0; font-size:12px; font-weight:bold; text-decoration:none; margin-top:5px; display:inline-block;">View Details →</a>
                </div>
            `);
    });
</script>
{% endblock %}
